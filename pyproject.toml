[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwatch"
version = "0.1.0"
description = "Match your software inventory (Intune, servers, Kubernetes) against free vulnerability feeds and alert only on what matters."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
intune = ["azure-identity>=1.15"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
patchwatch = "patchwatch.cli:main"

[tool.setuptools]
packages = ["patchwatch"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
